# =============================================================================
# Streaming Release Tracker — MVP schema
#
# Scope: read-only. Upcoming releases on one service (Netflix), with titles,
# previews, thumbnails and descriptions. No auth, no user data, no persistence.
#
# Two rules carried over from planning, and they are the only two things here
# that are not strictly minimal:
#
#   1. One resolver must do real work. -> Release.daysUntilRelease
#   2. Model as if a second service already exists. -> Provider is a row of
#      data, not a type. The word "Netflix" does not appear in this file.
#
# Everything else deferred lives in ./schema_roadmap.graphql, which is a
# design sketch, not a build target.
# =============================================================================


# -----------------------------------------------------------------------------
# Scalars
# -----------------------------------------------------------------------------

"An ISO-8601 calendar date with no time component, e.g. \"2026-11-26\"."
scalar Date

"An absolute http(s) URL. Validated on serialize so clients can trust it."
scalar URL


# -----------------------------------------------------------------------------
# Enums
# -----------------------------------------------------------------------------

"Film or series, for lists that take one kind at a time."
enum MediaKind {
  MOVIE
  SERIES
}

"How a catalogue is ordered."
enum CatalogSort {
  "Most watched right now, by TMDB's popularity score."
  POPULAR
  "Highest rated, among titles with enough votes to mean it."
  TOP_RATED
  "Most recently released first."
  NEWEST
}


"""
Requested image dimension. The provider adapter maps this onto whatever size
buckets the upstream API uses. Present in the MVP because thumbnails are in
scope and a grid and a detail page need different sizes of the same image.
"""
enum ImageSize {
  SMALL
  MEDIUM
  LARGE
  ORIGINAL
}

# -----------------------------------------------------------------------------
# Provider
#
# Deliberately thin. No pricing, no plans — that arrives with the savings
# feature. What matters for the MVP is that a release points AT a provider
# rather than assuming one.
# -----------------------------------------------------------------------------

type Provider {
  id: ID!

  "Ways to pay for this service, cheapest first. Empty when prices are unknown."
  plans: [Plan!]!

  "When the plan prices were last checked by hand. Null when there are none."
  pricesCheckedOn: Date

  "Stable machine name used in filters and URLs, e.g. \"netflix\"."
  slug: String!

  "Human-facing name."
  name: String!

  logoUrl(size: ImageSize = SMALL): URL
}

"""
A way to pay for a service, at its published US monthly price. No API
publishes these, so they are checked by hand and dated on the Provider.
"""
type Plan {
  "Stable within its service, e.g. \"standard-ads\"."
  id: ID!

  name: String!

  "In cents. Money is kept in whole cents so sums are exact."
  monthlyCents: Int!

  hasAds: Boolean!

  "The plan assumed when a user ticks the service without choosing one."
  isDefault: Boolean!
  
  """
  True when the plan pays for more than streaming (Amazon Prime's shipping,
  say), so it starts outside cost estimates until the user brings it in.
  """
  leaveOutByDefault: Boolean!

  "What sets this plan apart beyond price and ads, when anything does."
  note: String
}


# -----------------------------------------------------------------------------
# Media
#
# An interface rather than a union: Movie and Series share nearly every field,
# so a union would force a type-conditional fragment even to read `title`.
# Clients select the common fields once and narrow only where the types really
# diverge.
# -----------------------------------------------------------------------------

interface MediaItem {
  id: ID!

  title: String!

  "Synopsis. Nullable — upstream coverage is patchy for unannounced titles."
  overview: String

  "Vertical key art. Nullable, and the client must design for its absence."
  posterUrl(size: ImageSize = MEDIUM): URL

  "Horizontal art for hero and detail layouts."
  backdropUrl(size: ImageSize = LARGE): URL

  """
  Best available preview, picked server-side by a ranking rule rather than
  handing the client an unordered list to choose from.
  """
  trailer: Video
  totalRuntime: Runtime
  availableOn: [Provider!]!
}

type Movie implements MediaItem {
  id: ID!
  title: String!
  overview: String
  posterUrl(size: ImageSize = MEDIUM): URL
  backdropUrl(size: ImageSize = LARGE): URL
  trailer: Video
  totalRuntime: Runtime
  availableOn: [Provider!]!

  runtimeMinutes: Int
}

type Series implements MediaItem {
  id: ID!
  title: String!
  overview: String
  posterUrl(size: ImageSize = MEDIUM): URL
  backdropUrl(size: ImageSize = LARGE): URL
  trailer: Video
  totalRuntime: Runtime
  availableOn: [Provider!]!

  seasonCount: Int
}

type Runtime {
  minutes: Int!

  """
  True when some episodes had no runtime upstream and were counted at their
  season's median length.
  """
  estimated: Boolean!
}


type Video {
  id: ID!
  name: String!

  "Playback page. Composed server-side from the upstream key and site."
  url: URL!

  """
  Privacy-enhanced player URL for an <iframe>. Composed server-side for the
  same reason `url` is. Null when the host has no embeddable player.
  """
  embedUrl: URL

  "\"Trailer\", \"Teaser\", \"Clip\"."
  type: String!
}


# -----------------------------------------------------------------------------
# Release
#
# The unit a user tracks is not a title, it is the EVENT of a title arriving
# on a service on a date. Keeping this as its own type is what allows one
# title to carry different dates on different services later without a
# breaking change, and it gives the computed field a natural home.
#
# MVP simplifications, each reversible:
#   - No region. Availability is genuinely region-scoped; the MVP assumes one
#     market and the adapter hardcodes it.
#   - No offer type. Subscription only.
#   - No departure date. "Upcoming" only, not "leaving soon".
# -----------------------------------------------------------------------------

type Release {
  "Opaque. Composed of (provider, media, date). Clients must not parse it."
  id: ID!

  media: MediaItem!

  """
  N+1 hotspot: resolving this across a list of releases is the textbook
  DataLoader case. Batch it before the list grows.
  """
  provider: Provider!

  "The date the title becomes watchable on this provider."
  availableFrom: Date!

  """
  The date the whole season can be watched in one sitting. Equal to
  availableFrom for a full drop; the last episode's date when a season airs
  weekly. This, not availableFrom, is the date a pause/resume decision should
  be made against.
  """
  bingeableFrom: Date

  """
  Whole days from today to `availableFrom`, in the caller's timezone.
  Negative once released.

  Computed per request, never stored: "days until" is a calendar question
  whose answer depends on the observer, and caching it across a midnight
  boundary is how off-by-one bugs ship.
  """
  daysUntilRelease(timezone: String = "UTC"): Int!


  "How many episodes this season holds. Null for a film."
  episodeCount: Int

  """
  False when a season's episodes arrive over time rather than all at once.
  Unpausing on availableFrom for one of these wastes most of the month.
  """
  isFullDrop: Boolean


  """
  Which season is arriving, when the release is a series. Null for movies.
  A value of 1 is a series premiere; anything higher is a returning season,
  which is the stronger signal for resuming a paused subscription.
  """
  seasonNumber: Int

  """
    Total viewing time for this release, in minutes: the sum of the season's
    episode runtimes, or the film's runtime. Null when upstream has no runtimes,
    which is common for unreleased titles.
  """
  watchTimeMinutes: Int

}


"""
One page of a catalogue. `nextCursor` is opaque: pass it back as `after` to
get the page that follows, and do not build or parse it. Null on the last page.
"""
type CatalogPage {
  items: [MediaItem!]!
  nextCursor: String
}


# -----------------------------------------------------------------------------
# Root
#
# No Mutation: the MVP is read-only and an empty stub is noise.
#
# `releases` returns a plain list with a limit rather than a cursor connection.
# Offset/limit is the wrong long-term answer for an insert-heavy feed — a title
# added upstream between page fetches shifts every later row — but pagination
# is not MVP logic. When it lands, this field changes shape. That is fine
# before there is a client contract to break.
# -----------------------------------------------------------------------------

type Query {
  """
  The main feed: upcoming releases, soonest first.
  """
  releases(
    "Filter to one service. Omitted means all providers."
    providerSlug: String

    "Inclusive lower bound on availableFrom. Defaults to today."
    from: Date

    "Inclusive upper bound on availableFrom."
    to: Date

    first: Int = 20
  ): [Release!]!

  release(id: ID!): Release

  "Fetch one title. Returns the interface; the client narrows with a fragment."
  mediaItem(id: ID!): MediaItem
  mediaItems(ids: [ID!]!): [MediaItem]!
  
  """
  Find titles by name, films and series together, best match first.
  An empty or whitespace-only query returns an empty list rather than an error.
  """
  searchMedia(
    query: String!
    first: Int = 10
    """
    Keep only titles streaming on subscription on at least one of these
    services. Only the best 20 matches upstream are considered, so a common
    word can return fewer than `first`.
    """
    providerSlugs: [String!]
  ): [MediaItem!]!


  """
  Everything streaming on subscription today on any of the given services,
  one kind at a time, a page at a time. Films and series are separate lists
  upstream, and merging two separately ranked lists has no right answer.
  """
  catalog(
    providerSlugs: [String!]!
    kind: MediaKind!
    sort: CatalogSort = POPULAR
    "A cursor from a previous page's nextCursor. Omitted means the first page."
    after: String
  ): CatalogPage!


  providers: [Provider!]!

  provider(slug: String!): Provider
}
