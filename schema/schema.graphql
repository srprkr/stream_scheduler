# =============================================================================
# StreamHopper schema
#
# The single source of truth for both halves: codegen turns it into resolver
# types on the server and query types on the web client.
#
# Read-only. The user's own data - library, services, prices paid - lives in
# their browser, so there is no Mutation yet (see Root, below).
#
# Two rules from the start still hold:
#
#   1. Services are rows of data, not types. The word "Netflix" does not
#      appear in this file; adding a service touches no schema.
#   2. Computed fields are computed per request, never stored - see
#      Release.daysUntilRelease.
#
# ./schema_roadmap.graphql is an older design sketch, not a build target.
# =============================================================================

# -----------------------------------------------------------------------------
# Scalars
# -----------------------------------------------------------------------------

"An ISO-8601 calendar date with no time component, e.g. \"2026-11-26\"."
scalar Date

"An absolute http(s) URL. Validated on serialize so clients can trust it."
scalar URL

# -----------------------------------------------------------------------------
# Enums
# -----------------------------------------------------------------------------

"Film or series, for lists that take one kind at a time."
enum MediaKind {
  MOVIE
  SERIES
}

"How a catalogue is ordered."
enum CatalogSort {
  "Most watched right now, by TMDB's popularity score."
  POPULAR
  "Highest rated, among titles with enough votes to mean it."
  TOP_RATED
  "Most recently released first."
  NEWEST
}

"""
Requested image dimension. The source maps this onto whatever size buckets
its upstream serves: a grid and a detail page want different sizes of one
image.
"""
enum ImageSize {
  SMALL
  MEDIUM
  LARGE
  ORIGINAL
}

# -----------------------------------------------------------------------------
# Provider
#
# A streaming service, and what it costs. A release points AT a provider
# rather than assuming one, which is what lets one title arrive on several.
# -----------------------------------------------------------------------------

type Provider {
  id: ID!

  "Ways to pay for this service, cheapest first. Empty when prices are unknown."
  plans: [Plan!]!

  "When the plan prices were last checked by hand. Null when there are none."
  pricesCheckedOn: Date

  "Stable machine name used in filters and URLs, e.g. \"netflix\"."
  slug: String!

  "Human-facing name."
  name: String!

  logoUrl(size: ImageSize = SMALL): URL

  "How to cancel it and what to know first. Null when the app has no record."
  cancellation: Cancellation
}

"""
How to cancel a service, checked by hand against its help pages and dated.
Every tracked service keeps a cancelled subscription running to the end of
the paid period - so cancelling straight after subscribing costs nothing.
"""
type Cancellation {
  url: URL!
  steps: [String!]!
  keepsAccessUntilPeriodEnd: Boolean!
  "Cancel at least this many hours before renewal for it to take; null if any time."
  cancelHoursBefore: Int
  "A built-in pause, when the service has one."
  pause: String
  refunds: String!
  "Contract gotchas: third-party billing, bundles, auto-resume, promotions."
  gotchas: [String!]!
  checkedOn: Date!
}

"""
A subscription service the app doesn't track, such as Crunchyroll or AMC+:
named so the user knows where else a title streams. It has no slug, since
nothing filters by it, and no plans.
"""
type OtherService {
  id: ID!
  name: String!
  logoUrl(size: ImageSize = SMALL): URL
}

"""
A way to pay for a service, at its published US monthly price. No API
publishes these, so they are checked by hand and dated on the Provider.
"""
type Plan {
  "Stable within its service, e.g. \"standard-ads\"."
  id: ID!

  name: String!

  "In cents. Money is kept in whole cents so sums are exact."
  monthlyCents: Int!

  hasAds: Boolean!

  "The plan assumed when a user ticks the service without choosing one."
  isDefault: Boolean!

  """
  True when the plan pays for more than streaming (Amazon Prime's shipping,
  say), so it starts marked "always keep": the plan never suggests cancelling
  it, and its cost runs every month. The user can untick it.
  """
  leaveOutByDefault: Boolean!

  "What sets this plan apart beyond price and ads, when anything does."
  note: String

  "In cents: the published price for a year paid up front. Null for monthly-only plans."
  yearlyCents: Int
}

# -----------------------------------------------------------------------------
# Media
#
# An interface rather than a union: Movie and Series share nearly every field,
# so a union would force a type-conditional fragment even to read `title`.
# Clients select the common fields once and narrow only where the types really
# diverge.
# -----------------------------------------------------------------------------

interface MediaItem {
  id: ID!

  title: String!

  "Synopsis. Nullable — upstream coverage is patchy for unannounced titles."
  overview: String

  "Vertical key art. Nullable, and the client must design for its absence."
  posterUrl(size: ImageSize = MEDIUM): URL

  "Horizontal art for hero and detail layouts."
  backdropUrl(size: ImageSize = LARGE): URL

  """
  Best available preview, picked server-side by a ranking rule rather than
  handing the client an unordered list to choose from.
  """
  trailer: Video
  totalRuntime: Runtime
  availableOn: [Provider!]!

  """
  Subscription services outside the tracked ones that stream it today.
  Resellers of a service ("Starz Amazon Channel") fold into that service, and
  apps that need a cable login are left out.
  """
  otherServices: [OtherService!]!

  """
  Arrivals still to come on the tracked services, soonest first: a film's
  streaming premiere, or a series' next season before it premieres. Where
  availableOn says where a title is now, this says where it's going - a film
  announced for Netflix next month is on no service today.
  """
  upcoming: [Release!]!

  """
  True when it has been released on DVD or Blu-ray, so a copy can be owned.
  A digital "purchase" doesn't count: it's a licence the store can lose.
  Films use recorded disc releases; series follow the network they were made
  for, with a hand-kept list of exceptions (TMDB has no disc data for TV).
  """
  onDisc: Boolean!
}

type Movie implements MediaItem {
  id: ID!
  title: String!
  overview: String
  posterUrl(size: ImageSize = MEDIUM): URL
  backdropUrl(size: ImageSize = LARGE): URL
  trailer: Video
  totalRuntime: Runtime
  availableOn: [Provider!]!
  otherServices: [OtherService!]!
  upcoming: [Release!]!
  onDisc: Boolean!

  runtimeMinutes: Int
}

type Series implements MediaItem {
  id: ID!
  title: String!
  overview: String
  posterUrl(size: ImageSize = MEDIUM): URL
  backdropUrl(size: ImageSize = LARGE): URL
  trailer: Video
  totalRuntime: Runtime
  availableOn: [Provider!]!
  otherServices: [OtherService!]!
  upcoming: [Release!]!
  onDisc: Boolean!
  seasonCount: Int
  nextSeason: SeasonSchedule

  """
  The tracked services the series was made for, by its network: where its
  seasons land, known even before a new show has a date or streams anywhere.
  Empty for networks the app doesn't track.
  """
  madeFor: [Provider!]!
}

"""
When a season starts and when it can be watched in one sitting - the date a
paused subscription should wait for. Built from the same episode dates as a
Release, so an unscheduled finale is null here too, never a guess.
"""
type SeasonSchedule {
  seasonNumber: Int!

  "First episode. In the past while a weekly season is still airing; null if undated."
  premieresOn: Date

  "Last episode. Null until every episode is dated upstream."
  fullyOutOn: Date

  """
  An estimate, not a date: the premiere plus the previous season's run. Set
  only while fullyOutOn is unknown; show it as an estimate, never plan
  reminders on it.
  """
  expectedFullyOutOn: Date

  "Null when too few episodes are dated to tell."
  isFullDrop: Boolean

  episodeCount: Int

  """
  How long the season takes to watch. Usually an estimate before it airs:
  episodes without a runtime are counted at the median length of this
  season's or the previous season's, and an unfinished season at least as
  long as the previous one. Null when there is nothing to go on.
  """
  watchTime: Runtime
}

type Runtime {
  minutes: Int!

  """
  True when some episodes had no runtime upstream and were counted at their
  season's median length.
  """
  estimated: Boolean!
}

type Video {
  id: ID!
  name: String!

  "Playback page. Composed server-side from the upstream key and site."
  url: URL!

  """
  Privacy-enhanced player URL for an <iframe>. Composed server-side for the
  same reason `url` is. Null when the host has no embeddable player.
  """
  embedUrl: URL

  "\"Trailer\", \"Teaser\", \"Clip\"."
  type: String!
}

# -----------------------------------------------------------------------------
# Release
#
# The unit a user tracks is not a title, it is the EVENT of a title arriving
# on a service on a date. Keeping this as its own type is what allows one
# title to carry different dates on different services later without a
# breaking change, and it gives the computed field a natural home.
#
# Simplifications, each reversible:
#   - No region. Availability is genuinely region-scoped; everything here
#     assumes the US and the adapter hardcodes it.
#   - No offer type. Subscription only.
#   - No departure date. "Upcoming" only, not "leaving soon".
# -----------------------------------------------------------------------------

type Release {
  "Opaque. Composed of (provider, media, date). Clients must not parse it."
  id: ID!

  media: MediaItem!

  """
  N+1 hotspot: resolving this across a list of releases is the textbook
  DataLoader case. Batch it before the list grows.
  """
  provider: Provider!

  "The date the title becomes watchable on this provider."
  availableFrom: Date!

  """
  The date the whole season can be watched in one sitting. Equal to
  availableFrom for a full drop; the last episode's date when a season airs
  weekly. This, not availableFrom, is the date a pause/resume decision should
  be made against.
  """
  bingeableFrom: Date

  """
  Whole days from today to `availableFrom`, in the caller's timezone.
  Negative once released.

  Computed per request, never stored: "days until" is a calendar question
  whose answer depends on the observer, and caching it across a midnight
  boundary is how off-by-one bugs ship.
  """
  daysUntilRelease(timezone: String = "UTC"): Int!

  "How many episodes this season holds. Null for a film."
  episodeCount: Int

  """
  False when a season's episodes arrive over time rather than all at once.
  Unpausing on availableFrom for one of these wastes most of the month.
  """
  isFullDrop: Boolean

  """
  Which season is arriving, when the release is a series. Null for movies.
  A value of 1 is a series premiere; anything higher is a returning season,
  which is the stronger signal for resuming a paused subscription.
  """
  seasonNumber: Int

  """
  Total viewing time for this release, in minutes: the sum of the season's
  episode runtimes, or the film's runtime. Null when upstream has no runtimes,
  which is common for unreleased titles.
  """
  watchTimeMinutes: Int
}

"""
One page of a catalogue. `nextCursor` is opaque: pass it back as `after` to
get the page that follows, and do not build or parse it. Null on the last page.
"""
type CatalogPage {
  items: [MediaItem!]!
  nextCursor: String
}

# -----------------------------------------------------------------------------
# Root
#
# No Mutation: nothing is saved server-side yet, and an empty stub is noise.
# It arrives with accounts, when libraries sync across devices.
#
# `releases` is a plain list with a limit: the 90-day feed is small and read
# whole. `catalog` is the one list deep enough to page, and it pages with an
# opaque cursor rather than offset/limit, which shifts rows whenever upstream
# inserts one.
# -----------------------------------------------------------------------------

type Query {
  """
  The main feed: upcoming releases, soonest first.
  """
  releases(
    "Filter to one service. Omitted means all providers."
    providerSlug: String

    "Inclusive lower bound on availableFrom. Defaults to today."
    from: Date

    "Inclusive upper bound on availableFrom."
    to: Date

    first: Int = 20
  ): [Release!]!

  release(id: ID!): Release

  "Fetch one title. Returns the interface; the client narrows with a fragment."
  mediaItem(id: ID!): MediaItem
  mediaItems(ids: [ID!]!): [MediaItem]!

  """
  Find titles by name, films and series together, best match first.
  An empty or whitespace-only query returns an empty list rather than an error.
  """
  searchMedia(
    query: String!
    first: Int = 10
    """
    Keep only titles streaming on subscription on at least one of these
    services. Only the best 20 matches upstream are considered, so a common
    word can return fewer than `first`.
    """
    providerSlugs: [String!]
  ): [MediaItem!]!

  """
  Everything streaming on subscription today on any of the given services,
  one kind at a time, a page at a time. Films and series are separate lists
  upstream, and merging two separately ranked lists has no right answer.
  """
  catalog(
    providerSlugs: [String!]!
    kind: MediaKind!
    sort: CatalogSort = POPULAR
    "A cursor from a previous page's nextCursor. Omitted means the first page."
    after: String
  ): CatalogPage!

  providers: [Provider!]!

  provider(slug: String!): Provider
}
